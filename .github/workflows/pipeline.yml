name: CI Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Setup JDK 21
        uses: actions/setup-java@v2
        with:
          distribution: "temurin" # vet ikke hvilken distribusjon som er best
          java-version: "21"

      - name: Install backend dependencies
        run: mvn install -DskipTests
        working-directory: backend

      - name: Build backend
        run:  mvn -B clean package --no-transfer-progress -Dsurefire.forkCount=1 -Dsurefire.reuseForks=false -DskipTests 
        working-directory: backend

      - name: Run backend tests
        run:  mvn -B test --no-transfer-progress -Dsurefire.forkCount=1 -Dsurefire.reuseForks=false        
        working-directory: backend
